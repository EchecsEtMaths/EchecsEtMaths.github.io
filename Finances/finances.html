<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget 2026</title>

    <link rel="stylesheet" href="finances.css">
</head>

<body>
    <header class="barre">
        <nav class="onglets" role="tablist">
            <button class="onglet actif" role="tab" aria-selected="true" data-onglet="dashboard">Tableau de
                bord</button>
            <button class="onglet" role="tab" aria-selected="false" data-onglet="details">Détails</button>
        </nav>
        <div class="auth">
            <button id="authorize_button">Authorize</button>
            <button id="signout_button">Sign Out</button>
        </div>
    </header>

    <main>
        <section id="vue-dashboard" class="vue">
            <div id="dashboard">
                <p class="info">Cliquez sur Authorize pour charger les données.</p>
            </div>
        </section>
        <section id="vue-details" class="vue" hidden>
            <div id="content">
                <p class="info">Cliquez sur Authorize pour charger les données.</p>
            </div>
        </section>
    </main>

    <script type="module" src="finances.js"></script>
</body>

</html>
