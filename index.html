<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeboard</title>
    <link rel="icon" href="./favicon.png" type="image/png">

    <style>
        #loading {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Hello World !</h1>
    <button>
        <a href="/ProgressionJournee.html">Progression de la journée</a>
    </button>
    <button id="load">Charger les users de la base de données</button>
    <p id="loading">Chargement...</p>
    <div>
        <ul id="users"></ul>
    </div>
    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

        const supabaseUrl = 'https://bfrpawpfgflfslysvtjz.supabase.co'
        const supabaseKey = 'sb_publishable_ZkP0cSUI7cdyb898jxCW_w_n3vBa59s'

        const supabase = createClient(supabaseUrl, supabaseKey);

        document.getElementById('load').onclick = async () => {
            document.getElementById("loading").style.display = "block";

            document.getElementById("users").innerHTML = "";

            const { data, error } = await supabase
                .from('User')
                .select('*');

            console.log('data:', data);
            console.log('error:', error);

            data.forEach(user => {
                document.getElementById("users").innerHTML += "<li>" + user.prenom + " " + user.nom + "</li>";
            });

            document.getElementById("loading").style.display = "none";
        }
    </script>

</body>

</html>
