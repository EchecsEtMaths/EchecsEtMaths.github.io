<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Board – Propositions de design</title>
<style>
/* ============ SHELL (sélecteur d'onglets) ============ */
*{box-sizing:border-box}
body{margin:0;background:#0c0c10;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.picker{position:sticky;top:0;z-index:100;display:flex;gap:8px;padding:10px 14px;background:#0c0c10;border-bottom:1px solid #2a2a33;overflow-x:auto}
.picker button{flex:0 0 auto;border:1px solid #3a3a46;background:#181820;color:#d8d8e2;padding:8px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.picker button[aria-selected=true]{background:#fff;color:#000;border-color:#fff;font-weight:600}
.panel{display:none}.panel.active{display:block}
.note{background:#15151c;color:#c9c9d6;padding:12px 18px;font-size:13.5px;line-height:1.5;border-bottom:1px solid #2a2a33}
.note b{color:#fff}

/* ============ BASE COMMUNE DES WIDGETS ============ */
.theme{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:var(--font);--bw:1px;--barh:8px;--inp:rgba(0,0,0,.05);
  position:relative;background:var(--bg);color:var(--text);font-family:var(--font);min-height:calc(100vh - 100px);overflow:hidden}
.theme h1,.theme h2{font-family:var(--fh);margin:0}
.theme a{color:inherit;text-decoration:none}
.theme ul{list-style:none;margin:0;padding:0}
.theme small,.theme .muted{color:var(--muted)}
.wg{background:var(--card);border:var(--bw) solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.wg h3{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center;font-family:var(--fh)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:10px 0 5px}
.bar{height:var(--barh);background:var(--barbg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:inherit;transition:width .4s}
.w-budget label{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:7px 0}
.w-budget input{width:96px;padding:6px 8px;border:var(--bw) solid var(--border);background:var(--inp);color:var(--text);border-radius:calc(var(--radius)/2);text-align:right;font:inherit}
.w-budget .res{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:13px}
.w-budget .res b{font-size:24px;font-family:var(--fh)}
.checks li{padding:5px 0;font-size:14px}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.quests li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--border)}
.quests li:last-child{border:0}
.quests b{display:block;font-size:14px}
.quests small{font-size:12px}
.q-ic{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid var(--accent);color:var(--accent)}
.quests .done .q-ic{background:var(--accent);color:var(--onaccent)}
.quests .done b{text-decoration:line-through;color:var(--muted)}
.people li{display:flex;align-items:center;gap:12px;padding:8px 0}
.people li div{flex:1}
.people b{display:block;font-size:14px}
.people small{font-size:12px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent);color:var(--onaccent);font-size:14px}
.dots{display:flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--barbg)}
.dots i.on{background:var(--accent)}
.finance .big{font-size:32px;font-weight:700;font-family:var(--fh);line-height:1.1}
.finance .up{font-size:13px;color:var(--good)}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin:14px 0}
.spark i{flex:1;background:var(--accent);opacity:.35;border-radius:4px 4px 0 0}
.spark i:last-child{opacity:1}
.cats li{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
@media(max-width:900px){.theme .grid>*{grid-column:1/-1!important;grid-row:auto!important}}

/* ============ 1. AURORA CLAIR ============ */
.t1{--bg:#f4f5fb;--card:#fff;--text:#1d2033;--muted:#7b8095;--border:#eceef6;--accent:#5b5bf0;--onaccent:#fff;--good:#1fa971;
  --grad:linear-gradient(90deg,#5b5bf0,#9a8cf9);--barbg:#e9eaf6;--radius:16px;--shadow:0 4px 22px rgba(40,40,100,.06)}
.t1 .layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 100px)}
.t1 aside{background:#fff;border-right:1px solid var(--border);padding:22px 14px}
.t1 .logo{font-weight:800;font-size:20px;color:var(--accent);padding:0 10px 20px}
.t1 nav a{display:block;padding:10px 12px;border-radius:10px;font-size:14px;color:#4a4f6a;margin-bottom:2px}
.t1 nav a.on{background:#eeeefe;color:var(--accent);font-weight:600}
.t1 nav a.add{margin-top:14px;border:1px dashed #c9cbe0;text-align:center;color:var(--muted)}
.t1 main{padding:28px}
.t1 header{margin-bottom:22px}.t1 h1{font-size:28px}
.t1 .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.t1 .w-progress,.t1 .w-budget,.t1 .w-finance{grid-column:span 4}
.t1 .w-quests{grid-column:span 5}.t1 .w-bag{grid-column:span 3}.t1 .w-people{grid-column:span 4}
@media(max-width:900px){.t1 .layout{grid-template-columns:1fr}.t1 aside{display:none}}

/* ============ 2. NOCTURNE GLASS ============ */
.t2{--bg:#0a0c1a;--card:rgba(255,255,255,.06);--text:#eef0ff;--muted:#9aa0c3;--border:rgba(255,255,255,.12);--accent:#6ee7ff;--onaccent:#06101c;--good:#5df2b0;
  --grad:linear-gradient(90deg,#6ee7ff,#a78bfa,#f472b6);--barbg:rgba(255,255,255,.1);--radius:22px;--shadow:0 10px 40px rgba(0,0,0,.35);--inp:rgba(255,255,255,.08)}
.t2 .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;pointer-events:none}
.t2 .b1{width:420px;height:420px;background:#6d4aff;top:-120px;left:-80px}
.t2 .b2{width:380px;height:380px;background:#00c2ff;bottom:-100px;right:-60px;opacity:.35}
.t2 .wrap{position:relative;max-width:1180px;margin:0 auto;padding:26px 22px}
.t2 header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.t2 .logo{font-weight:800;font-size:20px;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.t2 nav{display:flex;gap:6px;flex-wrap:wrap}
.t2 nav a{padding:7px 14px;border-radius:99px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid var(--border)}
.t2 nav a.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.t2 h1{font-size:34px;margin-bottom:22px;font-weight:300}.t2 h1 b{font-weight:800}
.t2 .wg{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.t2 .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.t2 .w-quests{grid-row:span 2}
.t2 .bar i{box-shadow:0 0 12px rgba(110,231,255,.6)}
.t2 .w-finance{grid-column:span 2}

/* ============ 3. QUEST RPG ============ */
.t3{--bg:#171022;--card:#261b3a;--text:#f3ead8;--muted:#b3a58f;--border:#e2b24a;--accent:#e2b24a;--onaccent:#1b1226;--good:#7be08a;--bw:2px;
  --grad:linear-gradient(90deg,#f59e0b,#fde047);--barbg:#120b1c;--radius:10px;--shadow:0 4px 0 #0c0715;--font:Georgia,"Times New Roman",serif;--fh:Georgia,serif;--barh:12px;--inp:#150d21}
.t3 .wrap{max-width:1180px;margin:0 auto;padding:22px}
.t3 .hud{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:12px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.t3 .avatar{font-size:34px;width:58px;height:58px;display:grid;place-items:center;border-radius:50%;background:#3b2a58;border:2px solid var(--border)}
.t3 .hud-info{flex:1}.t3 .hud-info b{letter-spacing:.5px}
.t3 .hud-info .bar{margin:6px 0 3px;border:1px solid #4a3a66}
.t3 .coins{font-weight:700;color:#fde047;font-size:18px}
.t3 .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.t3 .tabs a{padding:7px 12px;border:2px solid #4a3a66;border-radius:8px;font-size:13px;background:#1f1630}
.t3 .tabs a.on{border-color:var(--border);color:var(--accent)}
.t3 .badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.t3 .badges span{font-size:12px;padding:5px 10px;border-radius:99px;background:#33254c;border:1px solid #5a4780}
.t3 .grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px}
.t3 .w-quests{grid-row:span 2;background:linear-gradient(180deg,#30224a,#261b3a)}
.t3 .wg h3{text-transform:uppercase;letter-spacing:1.5px;font-size:13px;color:var(--accent)}
.t3 .quests small{color:#f0c35a}
.t3 .w-finance{grid-column:span 2}

/* ============ 4. BENTO PASTEL ============ */
.t4{--bg:#fffaf2;--card:#fff;--text:#1f1f24;--muted:rgba(31,31,36,.6);--border:transparent;--accent:#1f1f24;--onaccent:#fff;--good:#14804a;
  --grad:#1f1f24;--barbg:rgba(0,0,0,.1);--radius:30px;--shadow:none;--barh:10px;--inp:rgba(255,255,255,.6)}
.t4 .wrap{max-width:1180px;margin:0 auto;padding:30px 22px}
.t4 header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.t4 h1{font-size:54px;letter-spacing:-2px;line-height:1}
.t4 nav{display:flex;gap:6px;flex-wrap:wrap}
.t4 nav a{padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid #1f1f24;font-size:13px}
.t4 nav a.on{background:#1f1f24;color:#fff}
.t4 .grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto);grid-auto-flow:dense;gap:14px}
.t4 .w-progress{grid-column:span 2;background:#ffd6e0}
.t4 .w-budget{background:#d3ecff}
.t4 .w-bag{grid-row:span 2;background:#fff0b3}
.t4 .w-quests{grid-column:span 2;grid-row:span 2;background:#d6f5cb}
.t4 .w-people{background:#e6dbff}
.t4 .w-finance{grid-column:span 2;background:#ffdcbd}
.t4 .finance .big{font-size:46px;letter-spacing:-1.5px}
.t4 .q-ic{border-color:#1f1f24;color:#1f1f24}
.t4 .quests li{border-color:rgba(0,0,0,.15)}
.t4 .spark i{background:#1f1f24}
.t4 .dots i.on{background:#1f1f24}
@media(max-width:900px){.t4 .grid{grid-template-columns:1fr}.t4 h1{font-size:40px}}

/* ============ 5. ÉDITORIAL BRUT ============ */
.t5{--bg:#f1eee3;--card:#fff;--text:#111;--muted:#555;--border:#111;--bw:3px;--accent:#ff4d2e;--onaccent:#fff;--good:#0a7a3d;
  --grad:repeating-linear-gradient(45deg,#111 0 8px,#ffd400 8px 16px);--barbg:#fff;--radius:0;--shadow:6px 6px 0 #111;--font:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--fh:ui-monospace,Menlo,Consolas,monospace;--barh:16px;--inp:#fff}
.t5 .bar{border:3px solid #111;border-radius:0}.t5 .bar i{border-radius:0}
.t5 .wrap{max-width:1180px;margin:0 auto;padding:26px 22px}
.t5 header{border-bottom:6px solid #111;padding-bottom:12px;margin-bottom:26px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:10px}
.t5 h1{font-size:clamp(44px,9vw,100px);line-height:.9;text-transform:uppercase;letter-spacing:-3px}
.t5 h1 span{background:#ffd400;padding:0 8px}
.t5 nav{display:flex;gap:0;flex-wrap:wrap}
.t5 nav a{padding:6px 10px;border:3px solid #111;margin-left:-3px;font-size:12px;text-transform:uppercase;font-weight:700;background:#fff}
.t5 nav a.on{background:#111;color:#ffd400}
.t5 .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;counter-reset:n}
.t5 .wg{counter-increment:n}
.t5 .wg h3{text-transform:uppercase;font-size:17px;border-bottom:3px solid #111;padding-bottom:8px}
.t5 .wg h3::before{content:"0" counter(n);background:#111;color:#ffd400;padding:2px 7px;font-size:13px}
.t5 .q-ic,.t5 .av{border-radius:0}.t5 .dots i{border-radius:0;border:2px solid #111;background:#fff}.t5 .dots i.on{background:#ff4d2e}
.t5 .spark i{background:#111;border-radius:0}
.t5 .w-finance{grid-column:1/-1}
.t5 .w-budget input{border:3px solid #111}
@media(max-width:900px){.t5 .grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="picker" role="tablist" id="picker"></div>
<div id="panels"></div>

<script>
/* ---------- Données de démonstration ---------- */
const NAV=[['🏠','Accueil'],['⏳','Journée'],['🧮','Budget'],['🧳','Valise'],['🗺️','Voyage'],['🤝','Relations'],['📈','Finances']];
const navHTML=(cls='')=>NAV.map((n,i)=>`<a class="${i?'':'on'}" href="#">${cls==='icons'?n[0]+' ':''}${n[1]}</a>`).join('');
const dots=n=>'<span class="dots">'+[1,2,3,4,5].map(k=>`<i class="${k<=n?'on':''}"></i>`).join('')+'</span>';

/* ---------- Widgets (markup partagé, style propre à chaque design) ---------- */
const W={
progress:()=>`<article class="wg w-progress"><h3><span>⏳</span>Avancement</h3>
 <div class="row"><span>Journée</span><b data-day></b></div><div class="bar"><i data-daybar></i></div>
 <div class="row"><span>Semaine</span><b data-week></b></div><div class="bar"><i data-weekbar></i></div>
 <p class="muted" style="font-size:12px;margin:12px 0 0">Calculé d'après la date et l'heure actuelles.</p></article>`,
budget:()=>`<article class="wg w-budget"><h3><span>🧮</span>Calculateur de budget</h3>
 <label>Revenus <input type="number" value="2400" data-b="in"></label>
 <label>Dépenses fixes <input type="number" value="1150" data-b="fix"></label>
 <label>Dépenses variables <input type="number" value="620" data-b="var"></label>
 <div class="res"><span>Reste à vivre</span><b data-b="res"></b></div>
 <div class="bar" style="margin-top:8px"><i data-b="bar"></i></div><small data-b="pct"></small></article>`,
bag:()=>`<article class="wg w-bag"><h3><span>🧳</span>Ma valise</h3><ul class="checks">
 ${[['Passeport / ID',1],['Chargeurs',1],['Trousse de toilette',1],['Adaptateur prise',0],['Vêtements (5 jours)',0],['Assurance voyage',0]]
 .map(x=>`<li><label><input type="checkbox" ${x[1]?'checked':''}> ${x[0]}</label></li>`).join('')}</ul>
 <div class="row"><span>Prêt</span><b data-bag></b></div><div class="bar"><i data-bagbar></i></div></article>`,
quests:()=>`<article class="wg w-quests"><h3><span>🗺️</span>Voyage · Lisbonne <small style="margin-left:auto">2/5 quêtes</small></h3><ul class="quests">
 <li class="done"><span class="q-ic">✔</span><div><b>Réserver les vols</b><small>+100 XP</small></div></li>
 <li class="done"><span class="q-ic">✔</span><div><b>Réserver l'hébergement</b><small>+100 XP</small></div></li>
 <li><span class="q-ic">3</span><div><b>Monter au Castelo São Jorge</b><small>+60 XP</small></div></li>
 <li><span class="q-ic">4</span><div><b>Goûter un pastel de nata</b><small>+30 XP</small></div></li>
 <li><span class="q-ic">5</span><div><b>Tram 28 au coucher du soleil</b><small>+80 XP</small></div></li></ul></article>`,
people:()=>`<article class="wg w-people"><h3><span>🤝</span>Mon entourage</h3><ul class="people">
 <li><span class="av">C</span><div><b>Camille</b><small>Proche · vu il y a 2 j</small></div>${dots(5)}</li>
 <li><span class="av">T</span><div><b>Thomas</b><small>Ami · à relancer</small></div>${dots(3)}</li>
 <li><span class="av">L</span><div><b>Léa</b><small>Collègue · vu hier</small></div>${dots(4)}</li>
 <li><span class="av">M</span><div><b>Marc</b><small>Connaissance · il y a 3 mois</small></div>${dots(2)}</li></ul></article>`,
finance:()=>`<article class="wg w-finance finance"><h3><span>📈</span>Finances</h3>
 <div class="big">4 280,50 €</div><div class="up">▲ +3,2 % ce mois</div>
 <div class="spark">${[35,42,38,55,48,62,70].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>
 <ul class="cats"><li><span>Logement</span><b>− 780 €</b></li><li><span>Alimentation</span><b>− 310 €</b></li><li><span>Loisirs</span><b>− 140 €</b></li></ul></article>`
};
const all=()=>W.progress()+W.budget()+W.bag()+W.quests()+W.people()+W.finance();
const today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* ---------- Les 5 propositions ---------- */
const DESIGNS=[
{name:'1 · Aurora clair',
 note:`<b>Clair & épuré (type SaaS).</b> Sidebar fixe pour naviguer entre les modules, cartes blanches, une couleur d'accent. <b>Idéal si</b> tu veux un outil sobre, lisible et facile à étendre avec de nouvelles pages (il suffit d'ajouter une entrée au menu).`,
 html:()=>`<div class="theme t1"><div class="layout"><aside><div class="logo">◐ Life Board</div><nav>${navHTML('icons')}<a class="add" href="#">＋ Ajouter une page</a></nav></aside>
 <main><header><small>${today}</small><h1>Bonjour 👋</h1></header><div class="grid">${all()}</div></main></div></div>`},
{name:'2 · Nocturne glass',
 note:`<b>Sombre & glassmorphism.</b> Fond dégradé, cartes translucides, néons doux, navigation en pilules en haut. <b>Idéal si</b> tu veux un rendu moderne et immersif, agréable le soir.`,
 html:()=>`<div class="theme t2"><div class="blob b1"></div><div class="blob b2"></div><div class="wrap">
 <header><div class="logo">LIFE BOARD</div><nav>${navHTML()}<a href="#">＋</a></nav></header>
 <h1>Ta vie, <b>en un coup d'œil</b></h1><div class="grid">${W.progress()+W.quests()+W.budget()+W.bag()+W.people()+W.finance()}</div></div></div>`},
{name:'3 · Quest RPG',
 note:`<b>Gamifié.</b> Barre de HUD avec niveau, XP et pièces, badges, ton « parchemin / aventure ». Les voyages deviennent de vraies quêtes. <b>Idéal si</b> tu veux de la motivation et un côté ludique (on peut y rattacher de l'XP pour chaque module).`,
 html:()=>`<div class="theme t3"><div class="wrap">
 <div class="hud"><div class="avatar">🧙</div><div class="hud-info"><b>Niv. 7 · Aventurier du quotidien</b><div class="bar"><i style="width:68%"></i></div><small>680 / 1000 XP</small></div><div class="coins">🪙 1 240</div></div>
 <nav class="tabs">${navHTML('icons')}</nav>
 <div class="badges"><span>🔥 Série de 7 jours</span><span>🧳 Valise prête à 50 %</span><span>🏅 Épargnant</span><span>🔒 Prochain badge : ???</span></div>
 <div class="grid">${W.quests()+W.progress()+W.bag()+W.budget()+W.people()+W.finance()}</div></div></div>`},
{name:'4 · Bento pastel',
 note:`<b>Bento coloré.</b> Tuiles de tailles variées, une couleur pastel par module, très gros chiffres et typographie marquée. <b>Idéal si</b> tu veux repérer chaque thème instantanément grâce à sa couleur.`,
 html:()=>`<div class="theme t4"><div class="wrap"><header><h1>Life
Board.</h1><nav>${navHTML()}<a href="#">＋ Ajouter</a></nav></header>
 <div class="grid">${all()}</div></div></div>`},
{name:'5 · Éditorial brut',
 note:`<b>Brutaliste / magazine.</b> Gros titres, bordures épaisses, ombres dures, police monospace, sections numérotées. <b>Idéal si</b> tu veux une identité très marquée, originale et fortement contrastée.`,
 html:()=>`<div class="theme t5"><div class="wrap"><header><h1>Life<span>Board</span></h1><nav>${navHTML()}</nav></header>
 <div class="grid">${W.progress()+W.budget()+W.quests()+W.bag()+W.people()+W.finance()}</div></div></div>`}
];

/* ---------- Construction de la page ---------- */
const picker=document.getElementById('picker'),panels=document.getElementById('panels');
DESIGNS.forEach((d,i)=>{
 const b=document.createElement('button');b.textContent=d.name;b.setAttribute('role','tab');b.onclick=()=>show(i);picker.appendChild(b);
 const s=document.createElement('section');s.className='panel';s.innerHTML=`<div class="note">${d.note}</div>`+d.html();panels.appendChild(s);
});
function show(i){
 [...picker.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 [...panels.children].forEach((p,k)=>p.classList.toggle('active',k===i));
 history.replaceState(null,'','#'+(i+1));scrollTo(0,0);
}

/* ---------- Comportements ---------- */
function updProgress(){
 const n=new Date(),d=(n.getHours()*60+n.getMinutes())/1440,w=((n.getDay()+6)%7+d)/7;
 document.querySelectorAll('[data-day]').forEach(e=>e.textContent=Math.round(d*100)+' %');
 document.querySelectorAll('[data-week]').forEach(e=>e.textContent=Math.round(w*100)+' %');
 document.querySelectorAll('[data-daybar]').forEach(e=>e.style.width=d*100+'%');
 document.querySelectorAll('[data-weekbar]').forEach(e=>e.style.width=w*100+'%');
}
function updBud(w){
 const v=k=>+w.querySelector(`[data-b="${k}"]`).value||0,r=v('in')-v('fix')-v('var');
 w.querySelector('[data-b="res"]').textContent=r.toLocaleString('fr-FR')+' €';
 const p=v('in')?Math.max(0,Math.min(100,r/v('in')*100)):0;
 w.querySelector('[data-b="bar"]').style.width=p+'%';
 w.querySelector('[data-b="pct"]').textContent='Taux d\'épargne potentiel : '+Math.round(p)+' %';
}
function updBag(w){
 const c=[...w.querySelectorAll('input[type=checkbox]')],n=c.filter(x=>x.checked).length;
 w.querySelector('[data-bag]').textContent=n+'/'+c.length;
 w.querySelector('[data-bagbar]').style.width=n/c.length*100+'%';
}
document.addEventListener('input',e=>{const w=e.target.closest('.w-budget');if(w)updBud(w)});
document.addEventListener('change',e=>{const w=e.target.closest('.w-bag');if(w)updBag(w)});
document.querySelectorAll('.w-budget').forEach(updBud);
document.querySelectorAll('.w-bag').forEach(updBag);
updProgress();setInterval(updProgress,60000);
show(Math.max(0,Math.min(DESIGNS.length-1,(parseInt(location.hash.slice(1))||1)-1)));
</script>
</body>
</html>
