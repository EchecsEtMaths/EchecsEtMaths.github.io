<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Board – Variantes Bento pastel</title>
<style>
/* ============ SHELL (sélecteur d'onglets) ============ */
*{box-sizing:border-box}
body{margin:0;background:#0c0c10;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.picker{position:sticky;top:0;z-index:100;display:flex;gap:8px;padding:10px 14px;background:#0c0c10;border-bottom:1px solid #2a2a33;overflow-x:auto}
.picker button{flex:0 0 auto;border:1px solid #3a3a46;background:#181820;color:#d8d8e2;padding:8px 14px;border-radius:99px;cursor:pointer;font-size:14px}
.picker button[aria-selected=true]{background:#fff;color:#000;border-color:#fff;font-weight:600}
.panel{display:none}.panel.active{display:block}
.note{background:#15151c;color:#c9c9d6;padding:12px 18px;font-size:13.5px;line-height:1.5;border-bottom:1px solid #2a2a33}
.note b{color:#fff}

/* ============ BASE BENTO (commune aux 6 variantes) ============ */
.bt{--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:var(--font);
  --bw:0px;--bc:transparent;--shadow:none;--gap:14px;--pad:20px;--radius:28px;--barh:10px;
  --muted:rgba(25,25,35,.6);--barbg:rgba(0,0,0,.1);--good:#14804a;
  background:var(--bg);color:var(--pt,var(--ink));font-family:var(--font);min-height:calc(100vh - 100px);position:relative}
.bt h1,.bt h2,.bt h3{font-family:var(--fh);margin:0}
.bt ul{list-style:none;margin:0;padding:0}
.bt a{color:inherit;text-decoration:none;cursor:pointer}
.bt .wrap{max-width:1180px;margin:0 auto;padding:30px 22px}
.bt .hd-date{opacity:.6;font-size:13px}
.bt .grid{display:grid;gap:var(--gap)}

.tile{background:var(--tc,#fff);color:var(--ink);border:var(--bw) solid var(--bc);border-radius:var(--radius);padding:var(--pad);box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.tile h3{margin:0 0 12px;font-size:15px;display:flex;gap:8px;align-items:center}
.tile small,.tile .muted{color:var(--muted)}
.w-progress{--tc:var(--c1)}.w-budget{--tc:var(--c2)}.w-bag{--tc:var(--c3)}
.w-quests{--tc:var(--c4)}.w-people{--tc:var(--c5)}.w-finance{--tc:var(--c6)}

.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:10px 0 5px}
.bar{height:var(--barh);background:var(--barbg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:inherit;transition:width .4s}

/* anneau de progression (affiché seulement dans certaines variantes) */
.ring-wrap{display:none;position:relative;width:112px;height:112px;margin:4px 0 8px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--ink) calc(var(--p,0)*1%),var(--barbg) 0);
  -webkit-mask:radial-gradient(farthest-side,#0000 calc(100% - 13px),#000 calc(100% - 12px));mask:radial-gradient(farthest-side,#0000 calc(100% - 13px),#000 calc(100% - 12px))}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;letter-spacing:-1px}

.w-budget label{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:7px 0}
.w-budget input{width:96px;padding:6px 8px;border:1.5px solid rgba(0,0,0,.15);background:rgba(255,255,255,.65);color:var(--ink);border-radius:12px;text-align:right;font:inherit}
.w-budget .res{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;font-size:13px}
.w-budget .res b{font-size:26px;letter-spacing:-1px}
.checks li{padding:5px 0;font-size:14px}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--ink);width:16px;height:16px}
.quests li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(0,0,0,.18)}
.quests li:last-child{border:0}
.quests b{display:block;font-size:14px}.quests small{font-size:12px}
.q-ic{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:2px solid var(--ink)}
.quests .done .q-ic{background:var(--ink);color:#fff}
.quests .done b{text-decoration:line-through;color:var(--muted)}
.people li{display:flex;align-items:center;gap:12px;padding:8px 0}
.people li div{flex:1}.people b{display:block;font-size:14px}.people small{font-size:12px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink);color:#fff;font-size:14px}
.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.15)}.dots i.on{background:var(--ink)}
.finance .big{font-size:40px;font-weight:700;letter-spacing:-1.5px;line-height:1.1}
.finance .up{font-size:13px;color:var(--good);font-weight:600}
.spark{display:flex;align-items:flex-end;gap:6px;height:70px;margin:14px 0}
.spark i{flex:1;background:var(--ink);opacity:.3;border-radius:5px 5px 0 0}.spark i:last-child{opacity:1}
.cats li{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}

/* ============ B1 · CLASSIQUE ============ */
.b1{--bg:#fffaf2;--ink:#1f1f24;--c1:#ffd6e0;--c2:#d3ecff;--c3:#fff0b3;--c4:#d6f5cb;--c5:#e6dbff;--c6:#ffdcbd}
.b1 header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:24px}
.b1 h1{font-size:54px;letter-spacing:-2px;line-height:1}
.b1 nav{display:flex;gap:6px;flex-wrap:wrap}
.b1 nav a{padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid #1f1f24;font-size:13px}
.b1 nav a.on{background:#1f1f24;color:#fff}
.b1 .grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,auto);grid-auto-flow:dense}
.b1 .w-progress,.b1 .w-finance{grid-column:span 2}
.b1 .w-bag{grid-row:span 2}
.b1 .w-quests{grid-column:span 2;grid-row:span 2}
.b1 .finance .big{font-size:48px}

/* ============ B2 · NUIT (pastels sur fond sombre) ============ */
.b2{--bg:#14141b;--pt:#f3f3f8;--ink:#1c1c26;--c1:#f7b6c8;--c2:#a9d6ff;--c3:#ffe48a;--c4:#a9e8a0;--c5:#cbb8ff;--c6:#ffc08f;--radius:26px}
.b2 header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.b2 h1{font-size:30px;letter-spacing:-1px}.b2 h1 span{opacity:.5;font-weight:400}
.b2 nav{display:flex;gap:6px;flex-wrap:wrap}
.b2 nav a{padding:8px 14px;border-radius:99px;font-size:13px;border:1px solid rgba(255,255,255,.22)}
.b2 nav a.on{background:#f3f3f8;color:#14141b;font-weight:600}
.b2 .grid{grid-template-columns:repeat(4,1fr);grid-auto-flow:dense}
.b2 .w-quests{grid-column:span 2;grid-row:span 2}
.b2 .w-progress,.b2 .w-bag,.b2 .w-finance{grid-column:span 2}
.b2 .tile:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.45)}

/* ============ B3 · STICKER (contours épais, ombres dures) ============ */
.b3{--bg:#fff4d6;--ink:#111;--muted:rgba(17,17,17,.65);--c1:#ff9ec0;--c2:#8fd3ff;--c3:#ffe066;--c4:#9bec8f;--c5:#c9a8ff;--c6:#ffb878;
  --bw:2.5px;--bc:#111;--shadow:5px 5px 0 #111;--radius:22px;--gap:22px;--barbg:#fff;--barh:14px;
  background:radial-gradient(rgba(0,0,0,.16) 1.3px,transparent 1.6px) 0 0/20px 20px,var(--bg)}
.b3 header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:30px}
.b3 .logo{display:inline-block;background:#ffe066;border:2.5px solid #111;box-shadow:4px 4px 0 #111;padding:6px 18px;font-size:34px;font-weight:900;letter-spacing:-1px;transform:rotate(-3deg);border-radius:14px}
.b3 nav{display:flex;gap:8px;flex-wrap:wrap}
.b3 nav a{padding:7px 13px;border:2.5px solid #111;border-radius:99px;background:#fff;font-size:13px;font-weight:700}
.b3 nav a.on{background:#111;color:#ffe066}
.b3 .grid{grid-template-columns:repeat(3,1fr);grid-auto-flow:dense}
.b3 .w-quests{grid-column:span 2;grid-row:span 2}
.b3 .bar{border:2.5px solid #111}
.b3 .w-budget input{border:2px solid #111;background:#fff}
.b3 .q-ic{background:#fff}.b3 .av{border:2px solid #111}
.b3 .tile:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 #111}
.b3 .tile h3{font-weight:800;font-size:16px}

/* ============ B4 · RAIL + HERO ============ */
.b4{--bg:#f2f0ea;--ink:#1f1f24;--c1:#fbd0dc;--c2:#cde4fb;--c3:#fbeaa6;--c4:#cdeec4;--c5:#ddd3f7;--c6:#fbd9bf;--radius:24px}
.b4 .layout{display:grid;grid-template-columns:86px 1fr;min-height:calc(100vh - 100px)}
.b4 .rail{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0}
.b4 .rail .lg{width:46px;height:46px;border-radius:16px;background:#1f1f24;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.b4 .rail a{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px}
.b4 .rail a.on{background:#1f1f24;box-shadow:0 0 0 3px #fff,0 0 0 5px #1f1f24}
.b4 .rail a.add{background:transparent;border:2px dashed #b8b4a8;color:#8a8678}
.b4 main{padding:26px 26px 30px 6px}
.b4 .grid{grid-template-columns:repeat(12,1fr)}
.b4 .hero{grid-column:1/-1;background:#1f1f24;color:#fff;border-radius:var(--radius);padding:26px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:18px}
.b4 .hero h1{font-size:42px;letter-spacing:-1.5px;line-height:1.05}
.b4 .chips{display:flex;gap:8px;flex-wrap:wrap}
.b4 .chips span{padding:9px 15px;border-radius:99px;font-size:13px;font-weight:600;color:#1f1f24}
.b4 .w-progress,.b4 .w-budget,.b4 .w-bag,.b4 .w-people,.b4 .w-finance{grid-column:span 4}
.b4 .w-quests{grid-column:span 4}
.b4 .ring-wrap{display:block}.b4 .r-day{display:none}

/* ============ B5 · DÉGRADÉS DOUX + DOCK ============ */
.b5{--bg:linear-gradient(135deg,#fdeef8 0%,#ebe8ff 50%,#def3ff 100%);--ink:#241f3a;--muted:rgba(36,31,58,.62);
  --c1:linear-gradient(145deg,#ffe3ee,#ffc7da);--c2:linear-gradient(145deg,#e1f1ff,#bfe0ff);--c3:linear-gradient(145deg,#fff4c4,#ffe38f);
  --c4:linear-gradient(145deg,#e0f8d8,#b9eab0);--c5:linear-gradient(145deg,#efe7ff,#d3c2ff);--c6:linear-gradient(145deg,#ffe8d3,#ffcfa3);
  --radius:34px;--pad:24px;--gap:18px;--shadow:0 14px 34px rgba(90,70,150,.14);--barh:12px}
.b5 .wrap{padding-bottom:120px}
.b5 header{text-align:center;margin-bottom:28px}
.b5 h1{font-size:48px;letter-spacing:-2px;background:linear-gradient(90deg,#ff7aa8,#8b6bff,#37b6ff);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.b5 .grid{grid-template-columns:repeat(6,1fr);grid-auto-flow:dense}
.b5 .w-progress,.b5 .w-budget{grid-column:span 3}
.b5 .w-quests{grid-column:span 3;grid-row:span 2}
.b5 .w-bag,.b5 .w-people,.b5 .w-finance{grid-column:span 2}
.b5 .tile:hover{transform:translateY(-4px)}
.b5 .ring-wrap{display:block}.b5 .r-day{display:none}
.b5 .dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:6px;padding:8px;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:99px;box-shadow:0 10px 30px rgba(60,40,120,.22);z-index:50}
.b5 .dock a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.b5 .dock a.on{background:#241f3a}

/* ============ B6 · MONOCHROME SAUGE (+ 1 accent pêche) ============ */
.b6{--bg:#eef2e8;--ink:#1c2b1f;--muted:rgba(28,43,31,.62);--barbg:rgba(28,43,31,.12);
  --c1:#d4e6c8;--c2:#c3dbb8;--c3:#e4eed6;--c4:#b7d2a8;--c5:#dbe8cf;--c6:#f1cdb5;
  --fh:Georgia,"Times New Roman",serif;--radius:26px;--good:#2f6b3a}
.b6 header{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:14px;margin-bottom:26px}
.b6 h1{font-size:58px;letter-spacing:-2px;line-height:1;font-weight:400}.b6 h1 em{font-style:italic}
.b6 nav{display:flex;flex-wrap:wrap}
.b6 nav a{padding:6px 2px;margin-left:16px;font-size:14px;border-bottom:2px solid transparent}
.b6 nav a.on{border-color:var(--ink);font-weight:600}
.b6 .grid{grid-template-columns:repeat(4,1fr);grid-auto-flow:dense}
.b6 .w-quests{grid-column:span 2;grid-row:span 2}
.b6 .w-progress{grid-column:span 2}
.b6 .w-people,.b6 .w-finance{grid-column:span 2}
.b6 .tile h3{font-weight:400;font-size:18px}
.b6 .av{background:#c9835a}

@media(max-width:900px){
 .bt .grid{grid-template-columns:1fr!important}
 .bt .grid>*{grid-column:1/-1!important;grid-row:auto!important}
 .b4 .layout{grid-template-columns:1fr}.b4 .rail{display:none}.b4 main{padding:20px}
 .b1 h1,.b6 h1{font-size:40px}
}
</style>
</head>
<body>
<div class="picker" role="tablist" id="picker"></div>
<div id="panels"></div>

<script>
/* ---------- Données & helpers ---------- */
const NAV=[['🏠','Accueil'],['⏳','Journée'],['🧮','Budget'],['🧳','Valise'],['🗺️','Voyage'],['🤝','Relations'],['📈','Finances']];
const nav=icons=>NAV.map((n,i)=>`<a class="${i?'':'on'}">${icons?n[0]+' ':''}${n[1]}</a>`).join('');
const iconNav=()=>NAV.map((n,i)=>`<a class="${i?'':'on'}" title="${n[1]}">${n[0]}</a>`).join('');
const dots=n=>'<span class="dots">'+[1,2,3,4,5].map(k=>`<i class="${k<=n?'on':''}"></i>`).join('')+'</span>';
const today=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

/* ---------- Widgets (markup partagé) ---------- */
const W={
progress:()=>`<article class="tile w-progress"><h3><span>⏳</span>Avancement</h3>
 <div class="ring-wrap"><div class="ring" data-ring></div><b data-day></b></div>
 <div class="row r-day"><span>Journée</span><b data-day></b></div><div class="bar r-day"><i data-daybar></i></div>
 <div class="row"><span>Semaine</span><b data-week></b></div><div class="bar"><i data-weekbar></i></div>
 <p class="muted" style="font-size:12px;margin:12px 0 0">Calculé d'après la date et l'heure actuelles.</p></article>`,
budget:()=>`<article class="tile w-budget"><h3><span>🧮</span>Calculateur de budget</h3>
 <label>Revenus <input type="number" value="2400" data-b="in"></label>
 <label>Dépenses fixes <input type="number" value="1150" data-b="fix"></label>
 <label>Dépenses variables <input type="number" value="620" data-b="var"></label>
 <div class="res"><span>Reste à vivre</span><b data-b="res"></b></div>
 <div class="bar" style="margin-top:8px"><i data-b="bar"></i></div><small data-b="pct"></small></article>`,
bag:()=>`<article class="tile w-bag"><h3><span>🧳</span>Ma valise</h3><ul class="checks">
 ${[['Passeport / ID',1],['Chargeurs',1],['Trousse de toilette',1],['Adaptateur prise',0],['Vêtements (5 jours)',0],['Assurance voyage',0]]
 .map(x=>`<li><label><input type="checkbox" ${x[1]?'checked':''}> ${x[0]}</label></li>`).join('')}</ul>
 <div class="row"><span>Prêt</span><b data-bag></b></div><div class="bar"><i data-bagbar></i></div></article>`,
quests:()=>`<article class="tile w-quests"><h3><span>🗺️</span>Voyage · Lisbonne <small style="margin-left:auto">2/5 quêtes</small></h3><ul class="quests">
 <li class="done"><span class="q-ic">✔</span><div><b>Réserver les vols</b><small>+100 XP</small></div></li>
 <li class="done"><span class="q-ic">✔</span><div><b>Réserver l'hébergement</b><small>+100 XP</small></div></li>
 <li><span class="q-ic">3</span><div><b>Monter au Castelo São Jorge</b><small>+60 XP</small></div></li>
 <li><span class="q-ic">4</span><div><b>Goûter un pastel de nata</b><small>+30 XP</small></div></li>
 <li><span class="q-ic">5</span><div><b>Tram 28 au coucher du soleil</b><small>+80 XP</small></div></li></ul></article>`,
people:()=>`<article class="tile w-people"><h3><span>🤝</span>Mon entourage</h3><ul class="people">
 <li><span class="av">C</span><div><b>Camille</b><small>Proche · vu il y a 2 j</small></div>${dots(5)}</li>
 <li><span class="av">T</span><div><b>Thomas</b><small>Ami · à relancer</small></div>${dots(3)}</li>
 <li><span class="av">L</span><div><b>Léa</b><small>Collègue · vu hier</small></div>${dots(4)}</li>
 <li><span class="av">M</span><div><b>Marc</b><small>Connaissance · il y a 3 mois</small></div>${dots(2)}</li></ul></article>`,
finance:()=>`<article class="tile w-finance finance"><h3><span>📈</span>Finances</h3>
 <div class="big">4 280,50 €</div><div class="up">▲ +3,2 % ce mois</div>
 <div class="spark">${[35,42,38,55,48,62,70].map(h=>`<i style="height:${h}%"></i>`).join('')}</div>
 <ul class="cats"><li><span>Logement</span><b>− 780 €</b></li><li><span>Alimentation</span><b>− 310 €</b></li><li><span>Loisirs</span><b>− 140 €</b></li></ul></article>`
};
const std=()=>W.progress()+W.budget()+W.bag()+W.quests()+W.people()+W.finance();

/* ---------- Les 6 variantes ---------- */
const DESIGNS=[
{name:'1 · Classique',
 note:`<b>Le bento d'origine, affiné.</b> Fond crème, tuiles pastel, très gros titre, navigation en pilules à contour noir. <b>Idéal si</b> tu veux rester fidèle à ce que tu as choisi, avec une base sobre et facile à étendre.`,
 html:()=>`<div class="theme bt b1"><div class="wrap"><header><div><span class="hd-date">${today}</span><h1>Life
Board.</h1></div><nav>${nav()}<a>＋ Ajouter</a></nav></header>
 <div class="grid">${std()}</div></div></div>`},
{name:'2 · Nuit',
 note:`<b>Pastels sur fond sombre.</b> Les tuiles gardent leurs couleurs claires et ressortent fortement sur un fond presque noir, avec un effet de survol. <b>Idéal si</b> tu veux un rendu plus premium et agréable le soir, tout en gardant le côté coloré.`,
 html:()=>`<div class="theme bt b2"><div class="wrap"><header><h1>Life Board <span>/ aujourd'hui</span></h1><nav>${nav()}<a>＋</a></nav></header>
 <div class="grid">${W.quests()+W.progress()+W.budget()+W.people()+W.bag()+W.finance()}</div></div></div>`},
{name:'3 · Sticker',
 note:`<b>Ludique et graphique.</b> Contours noirs épais, ombres dures, fond à pois, logo « autocollant » incliné, couleurs plus vives. Les tuiles se soulèvent au survol. <b>Idéal si</b> tu veux une identité fun et très reconnaissable.`,
 html:()=>`<div class="theme bt b3"><div class="wrap"><header><span class="logo">Life Board ✦</span><nav>${nav()}<a>＋</a></nav></header>
 <div class="grid">${W.progress()+W.quests()+W.budget()+W.bag()+W.people()+W.finance()}</div></div></div>`},
{name:'4 · Rail + Hero',
 note:`<b>Structure d'application.</b> Barre latérale d'icônes, grande tuile d'accueil sombre avec résumé rapide, anneau de progression pour la journée. <b>Idéal si</b> tu prévois beaucoup de pages futures : la navigation reste compacte et toujours visible.`,
 html:()=>`<div class="theme bt b4"><div class="layout"><aside class="rail"><div class="lg">LB</div>${iconNav()}<a class="add" title="Ajouter une page">＋</a></aside>
 <main><div class="grid"><section class="hero"><div><span class="hd-date">${today}</span><h1>Bonjour 👋
Ta journée, en un coup d'œil</h1></div>
 <div class="chips"><span style="background:var(--c4)">🗺️ 2/5 quêtes</span><span style="background:var(--c3)">🧳 Valise 50 %</span><span style="background:var(--c2)">🧮 Reste 630 €</span><span style="background:var(--c5)">🤝 1 relance</span></div></section>
 ${W.progress()+W.budget()+W.bag()+W.quests()+W.people()+W.finance()}</div></main></div></div>`},
{name:'5 · Dégradés + Dock',
 note:`<b>Doux et arrondi.</b> Tuiles à dégradé léger, grands rayons, ombres diffuses, titre en dégradé et navigation sous forme de dock flottant en bas de l'écran (comme sur mobile). <b>Idéal si</b> tu veux un rendu très « app » et apaisant.`,
 html:()=>`<div class="theme bt b5"><div class="wrap"><header><span class="hd-date">${today}</span>
<h1>Life Board</h1></header>
 <div class="grid">${W.progress()+W.quests()+W.budget()+W.bag()+W.people()+W.finance()}</div></div><nav class="dock">${iconNav()}</nav></div>`},
{name:'6 · Sauge',
 note:`<b>Monochrome calme.</b> Une seule teinte (vert sauge) déclinée en nuances, un seul accent pêche pour les finances, titres en serif. <b>Idéal si</b> tu préfères un tableau de bord posé et élégant, moins « multicolore » mais toujours en tuiles.`,
 html:()=>`<div class="theme bt b6"><div class="wrap"><header><div><span class="hd-date">${today}</span><h1>Life <em>Board</em></h1></div><nav>${nav()}<a>＋</a></nav></header>
 <div class="grid">${W.quests()+W.progress()+W.budget()+W.bag()+W.people()+W.finance()}</div></div></div>`}
];

/* ---------- Construction de la page ---------- */
const picker=document.getElementById('picker'),panels=document.getElementById('panels');
DESIGNS.forEach((d,i)=>{
 const b=document.createElement('button');b.textContent=d.name;b.setAttribute('role','tab');b.onclick=()=>show(i);picker.appendChild(b);
 const s=document.createElement('section');s.className='panel';s.innerHTML=`<div class="note">${d.note}</div>`+d.html();panels.appendChild(s);
});
function show(i){
 [...picker.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i));
 [...panels.children].forEach((p,k)=>p.classList.toggle('active',k===i));
 history.replaceState(null,'','#'+(i+1));scrollTo(0,0);
}

/* ---------- Comportements ---------- */
function updProgress(){
 const n=new Date(),d=(n.getHours()*60+n.getMinutes())/1440,w=((n.getDay()+6)%7+d)/7;
 document.querySelectorAll('[data-day]').forEach(e=>e.textContent=Math.round(d*100)+' %');
 document.querySelectorAll('[data-week]').forEach(e=>e.textContent=Math.round(w*100)+' %');
 document.querySelectorAll('[data-daybar]').forEach(e=>e.style.width=d*100+'%');
 document.querySelectorAll('[data-weekbar]').forEach(e=>e.style.width=w*100+'%');
 document.querySelectorAll('[data-ring]').forEach(e=>e.style.setProperty('--p',d*100));
}
function updBud(w){
 const v=k=>+w.querySelector(`[data-b="${k}"]`).value||0,r=v('in')-v('fix')-v('var');
 w.querySelector('[data-b="res"]').textContent=r.toLocaleString('fr-FR')+' €';
 const p=v('in')?Math.max(0,Math.min(100,r/v('in')*100)):0;
 w.querySelector('[data-b="bar"]').style.width=p+'%';
 w.querySelector('[data-b="pct"]').textContent="Taux d'épargne potentiel : "+Math.round(p)+' %';
}
function updBag(w){
 const c=[...w.querySelectorAll('input[type=checkbox]')],n=c.filter(x=>x.checked).length;
 w.querySelector('[data-bag]').textContent=n+'/'+c.length;
 w.querySelector('[data-bagbar]').style.width=n/c.length*100+'%';
}
document.addEventListener('input',e=>{const w=e.target.closest('.w-budget');if(w)updBud(w)});
document.addEventListener('change',e=>{const w=e.target.closest('.w-bag');if(w)updBag(w)});
document.addEventListener('click',e=>{
 const a=e.target.closest('.bt a');if(!a)return;
 e.preventDefault();
 if(!a.classList.contains('add')&&a.textContent.trim()[0]!=='＋'){[...a.parentElement.children].forEach(x=>x.classList.toggle('on',x===a))}
});
document.querySelectorAll('.w-budget').forEach(updBud);
document.querySelectorAll('.w-bag').forEach(updBag);
updProgress();setInterval(updProgress,60000);
show(Math.max(0,Math.min(DESIGNS.length-1,(parseInt(location.hash.slice(1))||1)-1)));
</script>
</body>
</html>
