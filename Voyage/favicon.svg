<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1a00"/>
      <stop offset="100%" stop-color="#1a0f00"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi sombre -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Pointillé carte -->
  <rect x="6" y="6" width="52" height="52" rx="10" fill="none" stroke="#B8860B" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- Écu médiéval or -->
  <path d="M 32 12 C 42 12, 47 15, 47 26 C 47 39, 34 47, 32 51 C 30 47, 17 39, 17 26 C 17 15, 22 12, 32 12 Z" fill="url(#goldGrad)" stroke="#5C2E00" stroke-width="1"/>

  <!-- Rose des vents / Boussole 3D gravée -->
  <!-- Nord -->
  <polygon points="32,17 32,28 27,28" fill="#1a0f00"/>
  <polygon points="32,17 32,28 37,28" fill="#5C2E00"/>
  <!-- Sud -->
  <polygon points="32,39 32,28 27,28" fill="#5C2E00"/>
  <polygon points="32,39 32,28 37,28" fill="#1a0f00"/>
  <!-- Est -->
  <polygon points="43,28 32,28 32,23" fill="#1a0f00"/>
  <polygon points="43,28 32,28 32,33" fill="#5C2E00"/>
  <!-- Ouest -->
  <polygon points="21,28 32,28 32,23" fill="#5C2E00"/>
  <polygon points="21,28 32,28 32,33" fill="#1a0f00"/>
</svg>
