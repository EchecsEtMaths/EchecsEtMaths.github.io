<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../index.css" type="text/css">
    <link rel="icon" href="../favicon.png" type="image/png">

</head>

<body>
    <h1>Lifeboard</h1>

    <h2>Inscription</h2>

    <input type="text" placeholder="NOM" id="signup-nom" />
    <input type="text" placeholder="Prénom" id="signup-prenom" />
    <input id="signup-email" type="email" placeholder="Email">
    <input id="signup-password" type="password" placeholder="Mot de passe">

    <button id="signup">
        S'inscrire
    </button>

    <hr>

    <h2>Connexion</h2>

    <input id="login-email" type="email" placeholder="Email">
    <input id="login-password" type="password" placeholder="Mot de passe">

    <button id="login">
        Se connecter
    </button>

    <script src="../const.js"></script>
    <script type="module" src="login.js"></script>
</body>

</html>
