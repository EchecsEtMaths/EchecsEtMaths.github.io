<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progression de la Semaine</title>

  <!-- Favicon par défaut -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIiIGhlaWdodD0iMzIiIHZpZXdCb3g9IjAgMCAzMiAzMiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj4KPGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTQiIGZpbGw9IiM2MGE1ZmEiLz4KPHN2ZyB4PSI2IiB5PSI2IiB3aWR0aD0iMjAiIGhlaWdodD0iMjAiPgo8dGV4dCB4PSI1MCUiIHk9IjUwJSIgZm9udC1mYW1pbHk9InNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTYiIGZvbnQtd2VpZ2h0PSJib2xkIiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9ImNlbnRlciI+JTwvdGV4dD4KPC9zdmc+Cjwvc3ZnPgo=">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #e4e4e7;
    }

    .body-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #60a5fa;
      font-size: 2rem;
      text-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
    }

    /* Section des horaires */
    .schedule-settings {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .schedule-title {
      text-align: center;
      margin-bottom: 20px;
      color: #fbbf24;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .schedule-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: end;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-label {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .time-input {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 16px;
      color: #e4e4e7;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      outline: none;
    }

    .time-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
    }

    .time-input::-webkit-calendar-picker-indicator {
      filter: invert(1);
      opacity: 0.7;
    }

    .progress-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin: 30px 0;
    }

    .progress-container {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-title {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: 600;
    }

    .progress-title.week {
      color: #60a5fa;
    }

    .progress-title.day {
      color: #34d399;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .progress-fill {
      height: 100%;
      transition: width 1s ease-in-out;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill.week {
      background: linear-gradient(90deg, #3b82f6, #60a5fa, #06b6d4);
    }

    .progress-fill.day {
      background: linear-gradient(90deg, #059669, #34d399, #6ee7b7);
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      animation: shimmer 2s infinite;
    }

    @keyframes shimmer {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }

    .progress-details {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .info-card {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 15px;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .info-title {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-value {
      color: #60a5fa;
      font-size: 1.4rem;
      font-weight: 600;
    }

    .time-remaining {
      margin-top: 20px;
      text-align: center;
      font-size: 1.1rem;
      color: #cbd5e1;
    }

    @media (max-width: 768px) {
      .schedule-inputs {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .progress-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .container {
        padding: 25px;
      }

      h1 {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 480px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <script>
    // Variables globales pour les horaires
    let workSettings = {
      startHour: 7,
      startMinute: 30,
      endHour: 16,
      endMinute: 0
    };

    // Fonction pour sauvegarder les horaires dans le localStorage
    function saveSchedule() {
      localStorage.setItem('workSchedule', JSON.stringify(workSettings));
    }

    // Fonction pour charger les horaires depuis le localStorage
    function loadSchedule() {
      const saved = localStorage.getItem('workSchedule');
      if (saved) {
        workSettings = JSON.parse(saved);
        // Mettre à jour les inputs
        document.getElementById('startTime').value =
          workSettings.startHour.toString().padStart(2, '0') + ':' +
          workSettings.startMinute.toString().padStart(2, '0');
        document.getElementById('endTime').value =
          workSettings.endHour.toString().padStart(2, '0') + ':' +
          workSettings.endMinute.toString().padStart(2, '0');
      } else {
        // Valeurs par défaut
        document.getElementById('startTime').value = '07:30';
        document.getElementById('endTime').value = '16:00';
      }
    }

    // Fonction pour mettre à jour les horaires depuis les inputs
    function updateSchedule() {
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;

      if (startTime && endTime) {
        const startParts = startTime.split(':');
        const endParts = endTime.split(':');

        workSettings.startHour = parseInt(startParts[0]);
        workSettings.startMinute = parseInt(startParts[1]);
        workSettings.endHour = parseInt(endParts[0]);
        workSettings.endMinute = parseInt(endParts[1]);

        saveSchedule();
        calculateProgress(); // Recalculer immédiatement
      }
    }

    // Fonction pour créer un favicon super lisible avec des gros chiffres
    function updateFavicon(weekPercentage) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 128;
      canvas.height = 128;

      let bgColor, textColor;
      if (weekPercentage >= 80) {
        bgColor = '#10b981';
        textColor = 'white';
      } else if (weekPercentage >= 50) {
        bgColor = '#f59e0b';
        textColor = 'white';
      } else if (weekPercentage >= 20) {
        bgColor = '#3b82f6';
        textColor = 'white';
      } else {
        bgColor = '#ef4444';
        textColor = 'white';
      }

      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.arc(64, 64, 58, 0, 2 * Math.PI);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      const percentage = Math.round(weekPercentage);
      let text, fontSize;

      if (percentage === 100) {
        text = '✓';
        fontSize = '80px';
      } else if (percentage >= 10) {
        text = percentage.toString();
        fontSize = '52px';
      } else {
        text = percentage.toString();
        fontSize = '64px';
      }

      ctx.fillStyle = textColor;
      ctx.font = 'bold ' + fontSize + ' Impact, "Arial Black", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.fillText(text, 64, 64);

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.lineWidth = 2;
      ctx.strokeText(text, 64, 64);

      const dataURL = canvas.toDataURL('image/png');

      const oldFavicon = document.querySelector('link[rel="icon"]');
      if (oldFavicon) {
        oldFavicon.remove();
      }

      const favicon = document.createElement('link');
      favicon.rel = 'icon';
      favicon.type = 'image/png';
      favicon.href = dataURL;
      document.head.appendChild(favicon);
    }

    function updatePageTitle(weekPercentage, dayPercentage, timeLeftToday, isWorkDay, dayOfWeek) {
      let title = '';

      if (dayOfWeek === 0 || dayOfWeek === 6) {
        title = '🏖️ Weekend - ' + weekPercentage.toFixed(1) + '% semaine';
      } else if (!isWorkDay.started) {
        title = '⏰ ' + weekPercentage.toFixed(1) + '% - Pas encore commencé';
      } else if (!isWorkDay.ongoing) {
        title = '🏠 ' + weekPercentage.toFixed(1) + '% - Journée terminée';
      } else {
        title = weekPercentage.toFixed(1) + '% semaine | ' + dayPercentage.toFixed(1) + '% jour - ' + timeLeftToday + ' restantes';
      }

      document.title = title;
    }

    function formatTimeRemaining(milliseconds) {
      if (milliseconds <= 0) return '0h00';

      const hours = Math.floor(milliseconds / (1000 * 60 * 60));
      const minutes = Math.floor((milliseconds % (1000 * 60 * 60)) / (1000 * 60));

      return hours + 'h' + minutes.toString().padStart(2, '0');
    }

    function calculateProgress() {
      const now = new Date();

      // Utiliser les horaires personnalisés
      const workStartHour = workSettings.startHour;
      const workStartMinute = workSettings.startMinute;
      const workEndHour = workSettings.endHour;
      const workEndMinute = workSettings.endMinute;

      // Durée de travail par jour en minutes
      const dailyWorkMinutes = (workEndHour * 60 + workEndMinute) - (workStartHour * 60 + workStartMinute);

      // Total des minutes de travail par semaine (lundi à vendredi)
      const weeklyWorkMinutes = dailyWorkMinutes * 5;

      const dayOfWeek = now.getDay();

      // Vérifier l'état du jour de travail
      const todayWorkStart = new Date(now);
      todayWorkStart.setHours(workStartHour, workStartMinute, 0, 0);
      const todayWorkEnd = new Date(now);
      todayWorkEnd.setHours(workEndHour, workEndMinute, 0, 0);

      const isWorkDay = {
        started: now >= todayWorkStart,
        ongoing: now >= todayWorkStart && now <= todayWorkEnd,
        finished: now > todayWorkEnd
      };

      // ==================== PROGRESSION DE LA SEMAINE ====================
      let workedMinutesWeek = 0;

      if (dayOfWeek === 0 || dayOfWeek === 6) {
        workedMinutesWeek = weeklyWorkMinutes;
      } else {
        const daysWorked = Math.max(0, dayOfWeek - 1);
        workedMinutesWeek = daysWorked * dailyWorkMinutes;

        if (dayOfWeek >= 1 && dayOfWeek <= 5) {
          if (now >= todayWorkStart) {
            if (now <= todayWorkEnd) {
              const minutesWorkedToday = Math.floor((now - todayWorkStart) / (1000 * 60));
              workedMinutesWeek += minutesWorkedToday;
            } else {
              workedMinutesWeek += dailyWorkMinutes;
            }
          }
        }
      }

      const weekPercentage = Math.min(100, (workedMinutesWeek / weeklyWorkMinutes) * 100);

      // ==================== PROGRESSION DE LA JOURNÉE ====================
      let dayPercentage = 0;
      let minutesWorkedToday = 0;

      if (dayOfWeek >= 1 && dayOfWeek <= 5) {
        if (now < todayWorkStart) {
          dayPercentage = 0;
        } else if (now > todayWorkEnd) {
          dayPercentage = 100;
          minutesWorkedToday = dailyWorkMinutes;
        } else {
          minutesWorkedToday = Math.floor((now - todayWorkStart) / (1000 * 60));
          dayPercentage = (minutesWorkedToday / dailyWorkMinutes) * 100;
        }
      } else {
        dayPercentage = 0;
      }

      // Calculer le temps restant aujourd'hui
      let timeLeftToday = '0h00';
      if (dayOfWeek >= 1 && dayOfWeek <= 5 && isWorkDay.ongoing) {
        const timeUntilEndOfDay = todayWorkEnd - now;
        timeLeftToday = formatTimeRemaining(timeUntilEndOfDay);
      }

      // Mettre à jour le titre de la page et le favicon
      updatePageTitle(weekPercentage, dayPercentage, timeLeftToday, isWorkDay, dayOfWeek);
      updateFavicon(weekPercentage);

      // ==================== MISE À JOUR DE L'INTERFACE ====================

      // Progression de la semaine
      document.getElementById('weekProgressFill').style.width = weekPercentage + '%';
      document.getElementById('weekPercentage').textContent = weekPercentage.toFixed(1) + '%';

      const remainingWeekMinutes = Math.max(0, weeklyWorkMinutes - workedMinutesWeek);
      const remainingWeekHours = Math.floor(remainingWeekMinutes / 60);
      const remainingWeekMins = remainingWeekMinutes % 60;

      document.getElementById('weekDetails').textContent =
        remainingWeekHours + 'h' + remainingWeekMins.toString().padStart(2, '0') + ' restantes cette semaine';

      // Progression de la journée
      document.getElementById('dayProgressFill').style.width = dayPercentage + '%';
      document.getElementById('dayPercentage').textContent = dayPercentage.toFixed(1) + '%';

      let dayDetailsText = '';
      if (dayOfWeek === 0 || dayOfWeek === 6) {
        dayDetailsText = 'Pas de travail le weekend';
      } else if (isWorkDay.ongoing) {
        const remainingTodayMinutes = dailyWorkMinutes - minutesWorkedToday;
        const remainingTodayHours = Math.floor(remainingTodayMinutes / 60);
        const remainingTodayMins = remainingTodayMinutes % 60;
        dayDetailsText = remainingTodayHours + 'h' + remainingTodayMins.toString().padStart(2, '0') + ' restantes aujourd\'hui';
      } else if (!isWorkDay.started) {
        dayDetailsText = 'La journée n\'a pas encore commencé';
      } else {
        dayDetailsText = 'Journée de travail terminée';
      }

      document.getElementById('dayDetails').textContent = dayDetailsText;

      // Jour actuel
      const days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
      document.getElementById('currentDay').textContent = days[dayOfWeek];

      // Heure actuelle
      document.getElementById('currentTime').textContent = now.toLocaleTimeString('fr-FR', {
        hour: '2-digit',
        minute: '2-digit'
      });

      // Heures travaillées (pour la semaine)
      const workedHours = Math.floor(workedMinutesWeek / 60);
      const workedMins = workedMinutesWeek % 60;
      document.getElementById('workedHours').textContent = workedHours + 'h' + workedMins.toString().padStart(2, '0');

      // Heures restantes (pour la semaine)
      document.getElementById('remainingHours').textContent = remainingWeekHours + 'h' + remainingWeekMins.toString().padStart(2, '0');

      // Message de temps restant
      let message = '';
      if (weekPercentage >= 100) {
        message = 'Félicitations ! Votre semaine de travail est terminée ! 🎉';
      } else if (dayOfWeek === 0 || dayOfWeek === 6) {
        message = 'C\'est le weekend ! Profitez-en bien ! 😎';
      } else if (now.getHours() < workStartHour || (now.getHours() === workStartHour && now.getMinutes() < workStartMinute)) {
        message = 'La journée de travail n\'a pas encore commencé ⏰';
      } else if (now.getHours() >= workEndHour || (now.getHours() === workEndHour && now.getMinutes() >= workEndMinute)) {
        message = 'Journée de travail terminée ! 🏠';
      } else {
        const endOfDay = new Date(now);
        endOfDay.setHours(workEndHour, workEndMinute, 0, 0);
        const timeUntilEndOfDay = endOfDay - now;
        const hoursLeft = Math.floor(timeUntilEndOfDay / (1000 * 60 * 60));
        const minutesLeft = Math.floor((timeUntilEndOfDay % (1000 * 60 * 60)) / (1000 * 60));
        message = 'Plus que ' + hoursLeft + 'h' + minutesLeft.toString().padStart(2, '0') + ' aujourd\'hui ! 💪';
      }

      document.getElementById('timeRemaining').textContent = message;
    }

    // Initialisation au chargement de la page
    document.addEventListener('DOMContentLoaded', function () {
      loadSchedule();

      // Ajouter les événements sur les inputs
      document.getElementById('startTime').addEventListener('change', updateSchedule);
      document.getElementById('endTime').addEventListener('change', updateSchedule);

      // Première mise à jour
      calculateProgress();

      // Mettre à jour toutes les minutes
      setInterval(calculateProgress, 60000);

      // Animation d'apparition
      document.querySelector('.container').style.opacity = '0';
      document.querySelector('.container').style.transform = 'translateY(20px)';

      setTimeout(function () {
        document.querySelector('.container').style.transition = 'all 0.8s ease';
        document.querySelector('.container').style.opacity = '1';
        document.querySelector('.container').style.transform = 'translateY(0)';
      }, 100);
    });
  </script>
</head>

  <button>

  <div class="body-container">


    <div class="container">
      <h1>📊 Progression Travail</h1>

      <!-- Section des horaires personnalisés -->
      <div class="schedule-settings">
        <div class="schedule-title">⚙️ Mes Horaires</div>
        <div class="schedule-inputs">
          <div class="input-group">
            <label class="input-label" for="startTime">Heure d'embauche</label>
            <input type="time" id="startTime" class="time-input" value="07:30">
          </div>
          <div class="input-group">
            <label class="input-label" for="endTime">Heure de débauche</label>
            <input type="time" id="endTime" class="time-input" value="16:00">
          </div>
        </div>
      </div>

      <div class="progress-grid">
        <!-- Progression de la semaine -->
        <div class="progress-container">
          <div class="progress-title week">📅 Semaine</div>
          <div class="progress-label">
            <span>Avancement</span>
            <span id="weekPercentage">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill week" id="weekProgressFill"></div>
          </div>
          <div class="progress-details" id="weekDetails">
            Calcul en cours...
          </div>
        </div>

        <!-- Progression de la journée -->
        <div class="progress-container">
          <div class="progress-title day">🌅 Journée</div>
          <div class="progress-label">
            <span>Avancement</span>
            <span id="dayPercentage">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill day" id="dayProgressFill"></div>
          </div>
          <div class="progress-details" id="dayDetails">
            Calcul en cours...
          </div>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-card">
          <div class="info-title">Jour Actuel</div>
          <div class="info-value" id="currentDay">-</div>
        </div>
        <div class="info-card">
          <div class="info-title">Heure Actuelle</div>
          <div class="info-value" id="currentTime">-</div>
        </div>
        <div class="info-card">
          <div class="info-title">Heures Travaillées</div>
          <div class="info-value" id="workedHours">0h</div>
        </div>
        <div class="info-card">
          <div class="info-title">Heures Restantes</div>
          <div class="info-value" id="remainingHours">0h</div>
        </div>
      </div>

      <div class="time-remaining" id="timeRemaining">
        Calcul en cours...
      </div>
    </div>
  </div>
</body>
